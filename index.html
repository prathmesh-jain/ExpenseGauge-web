<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      ExpenseGauge | Personal Expense Tracker &amp; Expense Management
    </title>
    <meta
      name="description"
      content="Manage your personal finances with ExpenseGauge, a personal expense tracker for recording daily expenses, organizing transactions by category, managing multiple accounts and balances, monitoring spending trends, and reviewing monthly financial insights. Track expenses on the go, with offline request queuing and automatic synchronization when your connection returns."
    />
    <meta name="application-name" content="ExpenseGauge" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://expensegauge.prathmeshjain.in/"
    />

    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExpenseGauge" />
    <meta
      property="og:url"
      content="https://expensegauge.prathmeshjain.in/"
    />
    <meta
      property="og:title"
      content="ExpenseGauge | Personal Expense Tracker &amp; Expense Management"
    />
    <meta
      property="og:description"
      content="Take control of your personal finances with ExpenseGauge. Record daily expenses, organize spending by category, manage multiple accounts and balances, review monthly summaries, and explore spending trends. Your expense changes can be queued while offline and synchronized when connectivity returns."
    />
    <meta
      property="og:image"
      content="https://expensegauge.prathmeshjain.in/expensegauge.jpg"
    />
    <meta
      property="og:image:alt"
      content="ExpenseGauge personal expense tracking and financial management application"

      name="twitter:title"

    <meta
      name="twitter:image"
      content="https://expensegauge.prathmeshjain.in/expensegauge.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="ExpenseGauge personal expense tracking application"
    />
